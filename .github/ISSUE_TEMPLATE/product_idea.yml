name: Product idea
description: Submit an idea for Product Agent discovery and MVP specification; not approved for implementation by default
title: "Idea: "
body:
  - type: markdown
    attributes:
      value: |
        This request starts product discovery. Product Agent prepares a brief and specs; the product owner must approve scope before Platform Agent or Codex implements it.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user/customer problem, not just a desired technical solution.
      placeholder: What problem should this product address?
    validations:
      required: true
  - type: textarea
    id: audience
    attributes:
      label: Target users and existing evidence
      description: Who is affected? What do you know versus what are you assuming?
    validations:
      required: true
  - type: textarea
    id: outcomes
    attributes:
      label: Desired outcome and success indicators
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints, data sensitivity and exclusions
      description: Time, budget, security, privacy, integrations and things the MVP should avoid.
  - type: checkboxes
    id: confirmation
    attributes:
      label: Discovery state
      options:
        - label: I understand this is a draft idea, not approval to deploy or access real financial data.
          required: true
